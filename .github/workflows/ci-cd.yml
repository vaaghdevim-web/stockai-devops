name: StockAI DevOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/vaaghdevim/stockai-backend

jobs:

  validate:
    name: Validate Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate


  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout DevOps Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: saicharan5789/Stockai-31-08
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - name: Trivy Filesystem Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Trivy Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: 1

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: stockai-source-sbom.spdx.json
  codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - java

    steps:
      - name: Checkout DevOps Repository
        uses: actions/checkout@v4

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: saicharan5789/Stockai-31-08
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Setup Java 21
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Backend for CodeQL
        if: matrix.language == 'java'
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -DskipTests compile

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs:
      - validate
      - security

    steps:
      - name: Checkout DevOps Repository
        uses: actions/checkout@v4

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: saicharan5789/Stockai-31-08
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper Executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Backend Clean Verify
        working-directory: backend
        run: ./mvnw clean verify

      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: warn

      - name: Upload JaCoCo Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: warn


  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest
    needs:
      - validate
      - security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Type Check
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Production Build
        working-directory: frontend
        run: npm run build


  docker:
    name: Build and Scan Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - backend
      - frontend
      - codeql

    steps:
      - name: Checkout DevOps Repository
        uses: actions/checkout@v4

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: saicharan5789/Stockai-31-08
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - name: Build Backend Docker Image
        working-directory: backend
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Container Vulnerability Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Container Secret Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          scanners: secret
          exit-code: 1

      - name: Generate Container SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: spdx-json
          artifact-name: stockai-container-sbom.spdx.json

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Image Summary
        run: |
          echo "Backend Docker image built and security scanned."
          echo "Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Image pushed to GHCR."
          else
            echo "Pull request: image push skipped."
          fi