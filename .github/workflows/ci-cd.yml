name: StockAI DevOps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: stockai-backend
  AWS_ACCOUNT_ID: "970547378393"

jobs:

  validate:
    name: Validate DevOps Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate


  build-test-push:
    name: Build Test and Push Backend Image
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout DevOps Repository
        uses: actions/checkout@v4

      - name: Checkout Backend Repository
        uses: actions/checkout@v4
        with:
          repository: saicharan5789/Stockai-31-08
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper Executable
        working-directory: backend
        run: chmod +x mvnw

      - name: Run Backend Tests
        working-directory: backend
        run: ./mvnw clean test

      - name: Build Docker Image
        working-directory: backend
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ github.sha }} \
            .

      - name: Configure AWS Credentials Using OIDC
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::970547378393:role/StockAI-GitHubActions-ECR
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR Repository
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --region $AWS_REGION

      - name: Tag Image for ECR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker tag \
            $ECR_REPOSITORY:${{ github.sha }} \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}

      - name: Push Image to ECR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:${{ github.sha }}

      - name: CI/CD Summary
        run: |
          echo "Backend tests passed."
          echo "Docker image built successfully."

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Docker image pushed successfully to ECR."
          else
            echo "Pull request validation completed. ECR push skipped."
          fi