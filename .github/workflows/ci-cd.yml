name: StockAI DevOps CI/CD

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: stockai-backend
  AWS_ACCOUNT_ID: "970547378393"

jobs:
  validate:
    name: Validate DevOps files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  docker-build:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout DevOps repository
        uses: actions/checkout@v4

      - name: Check backend source
        run: |
          echo "Backend source is maintained in the backend repository."
          echo "Docker build will be added after backend integration."

  ecr-push:
    name: Push Docker Image to ECR
    runs-on: ubuntu-latest
    needs: docker-build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout DevOps repository
        uses: actions/checkout@v4

      - name: Show GitHub repository context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Repository ID: ${{ github.repository_id }}"
          echo "Repository owner ID: ${{ github.repository_owner_id }}"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::970547378393:role/StockAI-GitHubActions-ECR
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --region $AWS_REGION

      - name: CI/CD status
        run: |
          echo "GitHub OIDC authentication succeeded."
          echo "ECR repository access succeeded."
          echo "Docker push stage is ready."