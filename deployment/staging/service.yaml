apiVersion: v1
kind: Service
metadata:
  name: stockai-backend
  namespace: stockai-staging
  labels:
    app.kubernetes.io/name: stockai-backend
    environment: staging
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stockai-backend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
